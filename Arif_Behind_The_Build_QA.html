<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#f6f5fb;--surface:#ffffff;--ink:#181820;--muted:#6b6b78;--line:#e6e4f0;--panel:#efeaff;--accent:#6c5ce7;--accent2:#ff7a59;--sans:'Inter',Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans)}button{font:inherit}a{color:inherit;text-decoration:none}
.layout{display:grid;grid-template-columns:212px 1fr;min-height:100vh}.side{position:fixed;width:212px;height:100vh;border-right:1px solid var(--line);padding:26px 20px;display:flex;flex-direction:column;background:var(--surface);z-index:20}.mark{display:flex;align-items:center;gap:10px;margin-bottom:34px}.avatar{width:36px;height:36px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}.mark .who{min-width:0}.mark .name{display:block;font:800 12px/1.3 var(--sans);letter-spacing:0}.mark .role{display:block;font-size:9px;line-height:1.35;letter-spacing:.02em;color:var(--muted);margin-top:3px}.snav{display:flex;flex-direction:column;gap:3px}.snav a{display:block;padding:9px 11px;border-radius:9px;color:var(--muted);font-size:13px;font-weight:600;transition:background .15s,color .15s}.snav a:hover{background:var(--bg)}.snav a.active{background:var(--panel);color:var(--accent)}.sidebottom{margin-top:auto;color:var(--muted);font-size:10px;white-space:pre-line;line-height:1.6}.main{grid-column:2;padding:0 4vw 70px;max-width:1180px;width:100%;margin:auto}.top{height:64px;display:flex;justify-content:flex-end;align-items:center}.toggle{border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;background:var(--surface)}.toggle button{border:0;background:transparent;padding:7px 14px;font-size:11px;color:var(--muted);cursor:pointer;font-weight:700}.toggle button.on{background:var(--accent);color:#fff}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:36px 0 26px;align-items:center}.tiny{display:inline-block;font-size:10.5px;letter-spacing:.04em;color:var(--accent);font-weight:700;background:var(--panel);padding:5px 11px;border-radius:20px}.hero h1{font-size:clamp(30px,3.4vw,44px);line-height:1.15;letter-spacing:-.01em;font-weight:800;white-space:pre-line;margin:16px 0}.hero .intro{color:var(--muted);max-width:520px;font-size:14.5px;line-height:1.7}.buttons{display:flex;gap:12px;margin-top:24px}.btn{padding:12px 22px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;cursor:pointer;transition:border-color .15s,opacity .15s}.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.primary:hover{opacity:.9}.feature{border-radius:18px;overflow:hidden;cursor:pointer;background:var(--surface);border:1px solid var(--line);box-shadow:0 12px 30px rgba(30,20,60,.07)}.feature-art{aspect-ratio:16/11;background:var(--panel);display:block}.fcap{padding:16px 18px 18px}.fcap .label{font-size:10px;letter-spacing:.04em;color:var(--accent);font-weight:700}.fcap h3{font-size:17px;margin:6px 0 4px;font-weight:800}.fcap p{font-size:12.5px;color:var(--muted);max-width:420px;margin:0}.fcap .count{font-size:10px;color:var(--muted);margin-top:8px}
.content{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;margin-top:8px}.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:18px 0;font-size:12px}.filters span{cursor:pointer;padding:8px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:600;transition:all .15s}.filters span:hover{border-color:var(--accent)}.filters span.active{background:var(--accent);border-color:var(--accent);color:#fff}.filters .sort{margin-left:auto}.plist{display:grid;grid-template-columns:1fr 1fr;gap:18px}.prow{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:transform .15s,box-shadow .15s}.prow:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(30,20,60,.09)}.pnum{display:none}.thumb{aspect-ratio:16/10;background:var(--panel);position:relative;overflow:hidden}.ptext{padding:16px 18px 18px}.ptext .cat{display:inline-block;font-size:9.5px;letter-spacing:.03em;color:var(--accent);font-weight:700;background:var(--panel);padding:3px 9px;border-radius:12px}.ptext h3{font-size:15.5px;margin:10px 0 6px;font-weight:800;letter-spacing:-.01em}.prow:hover h3{color:var(--accent)}.ptext p{font-size:12px;color:var(--muted);margin:0 0 8px;line-height:1.5}.ptext .meta{font-size:10px;color:var(--muted)}.arrow{display:none}
.perspective{background:linear-gradient(160deg,var(--accent),var(--accent2));border-radius:18px;padding:28px;align-self:start;margin-top:8px;color:#fff}.perspective .tiny{background:rgba(255,255,255,.2);color:#fff}.perspective .quote{font:800 21px/1.4 var(--sans);margin:16px 0 14px;letter-spacing:-.01em}.perspective .desc{font-size:12px;color:rgba(255,255,255,.85);max-width:260px;line-height:1.6}.topics{border-top:1px solid rgba(255,255,255,.25);margin-top:22px;padding-top:18px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.chip{border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:6px 11px;font-size:10px;color:#fff}
.journey{padding:70px 0 20px;margin-top:50px}.journey h2,.about h2{font-size:26px;font-weight:800;letter-spacing:-.01em;margin:0 0 26px}.trow{position:relative;display:grid;grid-template-columns:120px 1fr;gap:26px;padding:20px 0 20px 20px;border-left:2px solid var(--line)}.trow:before{content:"";position:absolute;left:-6px;top:26px;width:11px;height:11px;border-radius:50%;background:var(--accent)}.trow .when{font-size:10.5px;color:var(--accent);font-weight:700}.trow h3{font-size:15px;font-weight:800;margin:0 0 5px}.trow p{font-size:12.5px;color:var(--muted);max-width:650px;margin:0;line-height:1.55}.about{padding:60px 0 30px}.about p{font:500 20px/1.6 var(--sans);max-width:820px;color:var(--ink)}
/* article */
.article{display:none}.article.on{display:block}.home.hide{display:none}.articleTop{padding:36px 0 34px}.back{font-size:12px;color:var(--accent);font-weight:700;cursor:pointer}.articleTop .cat{display:inline-block;font-size:10px;letter-spacing:.03em;color:var(--accent);font-weight:700;background:var(--panel);padding:5px 10px;border-radius:20px;margin-top:22px}.articleTop h1{font-size:clamp(28px,3.6vw,42px);font-weight:800;line-height:1.15;letter-spacing:-.01em;margin:14px 0 14px;max-width:800px}.articleTop p{font:500 16px/1.6 var(--sans);max-width:700px;color:var(--muted)}.articleBody{display:grid;grid-template-columns:170px minmax(0,680px);gap:50px;padding:44px 0 90px}.toc{position:sticky;top:30px;align-self:start}.toc div{font-size:9px;letter-spacing:.1em;color:var(--muted);margin-bottom:12px;font-weight:700}.toc a{display:block;font-size:11px;color:var(--muted);padding:5px 0;font-weight:600}.chapter{padding:0 0 40px}.chapter+.chapter{padding-top:36px;border-top:1px solid var(--line)}.chapter .n{font-size:10px;color:var(--accent);font-weight:800}.chapter h2{font-size:21px;font-weight:800;letter-spacing:-.01em;margin:6px 0 14px}.chapter p{font:400 15.5px/1.75 var(--sans);color:var(--ink);margin:0}.chapter.workflow p{font:12.5px/1.8 var(--sans);background:#181820;color:#eee;padding:22px;border-radius:12px}.chapter:last-child{background:var(--panel);padding:26px;border-radius:14px}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.side{position:sticky;top:0;width:100%;height:auto;flex-direction:row;align-items:center;padding:14px 18px;gap:16px;border-right:none;border-bottom:1px solid var(--line);z-index:30}.side .mark{margin-bottom:0;white-space:nowrap}.side .mark .role{display:none}.snav{display:flex;gap:6px;overflow-x:auto;white-space:nowrap}.snav a{padding:8px 12px}.sidebottom{display:none}.main{grid-column:1;padding:0 20px 60px}.hero{grid-template-columns:1fr}.content{grid-template-columns:1fr}.plist{grid-template-columns:1fr}.perspective{margin-top:0}.articleBody{grid-template-columns:1fr}.toc{position:static;border-bottom:1px solid var(--line);padding-bottom:16px}.toc a{display:inline-block;margin-right:12px}}
@media(max-width:650px){.main{padding:0 16px 45px}.top{height:52px}.hero{padding-top:24px;gap:24px}.hero h1{font-size:32px}.content{margin-top:16px}.filters{overflow:auto}.filters .sort{display:none}.perspective{padding:22px}.perspective .quote{font-size:18px}.trow{grid-template-columns:90px 1fr;gap:16px}.articleBody{padding-top:30px}.articleTop h1{font-size:30px}}

.feature-art img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}

.articleVisual img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}

}

const D={"ui":{"id":{"nav":["Beranda","Karya","Perjalanan","Tentang"],"switch":"EN","label":"BEHIND THE BUILD","hero":"Yang Saya Bangun,\nDan yang Saya Pelajari.","dek":"Lebih dari 10 tahun di Customer Experience membentuk cara saya melihat masalah dari sisi pelanggan dan operasional. Behind the Build adalah kumpulan cerita di balik apa yang saya bangun dengan bantuan AI: mengapa sebuah ide dimulai, keputusan yang saya ambil, bagian yang gagal, apa yang diperbaiki, dan pelajaran yang muncul ketika sesuatu benar-benar digunakan.","cta":"Jelajahi Karya","aboutBtn":"Tentang","featured":"KARYA UTAMA","featureTitle":"Vireqo.id","featureDesc":"Perjalanan dari ide layanan yang terlalu luas menjadi bisnis digital yang lebih fokus, dengan website, AI Client Assistant, dan CS Dashboard.","filters":["Semua","Produk","AI","Arsitektur","Eksperimen"],"sort":"Urutkan: Terbaru","persp":"PERSPEKTIF","quote":"“Saya tidak sedang mencoba terlihat seperti software engineer. Saya sedang belajar menggunakan AI untuk mengubah pengalaman Customer Experience menjadi sesuatu yang bisa dibangun dan diuji.”","quoteSub":"Setiap proyek dimulai dari masalah yang ingin saya pahami. Teknologi adalah alat; keputusan, konteks, pengujian, dan perbaikannya tetap menjadi bagian dari proses saya.","topics":"TOPIK UTAMA","topicList":["Customer Experience","AI & Otomasi","Produk & Positioning","Arsitektur Multi-client","Production & QA","SEO & GEO"],"foot":"Membangun\ndengan AI.\nBelajar\nsecara terbuka.","copyright":"© 2026\nNur Muhamad Arif","articleBack":"← Kembali ke karya","articleSections":["Awal","Masalah yang Ingin Diselesaikan","Yang Saya Bangun","Cara Kerjanya","Titik Balik","Hasil Saat Ini","Yang Saya Pelajari"]},"en":{"nav":["Home","Work","Journey","About"],"switch":"ID","label":"BEHIND THE BUILD","hero":"What I Built,\nAnd What I Learned.","dek":"More than 10 years in Customer Experience shaped how I look at problems from both the customer and operational sides. Behind the Build is a collection of stories behind the things I build with AI: why an idea started, the decisions I made, what failed, what changed, and the lessons that appeared once something was actually used.","cta":"Explore the Work","aboutBtn":"About Me","featured":"FEATURED WORK","featureTitle":"Vireqo.id","featureDesc":"The journey from an overly broad service idea into a more focused digital business built around websites, an AI Client Assistant, and CS Dashboards.","filters":["All","Product","AI","Architecture","Experiment"],"sort":"Sort: Newest","persp":"PERSPECTIVE","quote":"“I am not trying to present myself as a software engineer. I am learning to use AI to turn Customer Experience knowledge into things that can be built and tested.”","quoteSub":"Every project starts with a problem I want to understand. Technology is the tool; the decisions, context, testing, and iteration remain part of my process.","topics":"MAIN TOPICS","topicList":["Customer Experience","AI & Automation","Product & Positioning","Multi-client Architecture","Production & QA","SEO & GEO"],"foot":"Building\nwith AI.\nLearning\nin public.","copyright":"© 2026\nNur Muhamad Arif","articleBack":"← Back to work","articleSections":["Beginning","The Problem I Wanted to Solve","What I Built","How It Works","Turning Point","Where It Stands","What I Learned"]}},"projects":{"id":[{"key":"vireqo","num":"01","cat":"PRODUK","title":"Membangun Vireqo.id dari Nol","desc":"Dari ide yang terlalu luas menjadi bisnis digital yang lebih fokus. Prosesnya mencakup positioning, website, Ask BIMA, SEO, hingga struktur GEO.","date":"Agu — Sep 2026","read":"18 menit baca"},{"key":"bima","num":"02","cat":"AI","title":"Evolusi BIMA menjadi BimaGinga.site","desc":"Dari asisten percakapan menjadi ruang kerja AI pribadi untuk menulis, menganalisis, merencanakan, melakukan riset, dan membantu proses debugging.","date":"Sep 2026","read":"16 menit baca"},{"key":"client","num":"03","cat":"ARSITEKTUR","title":"Vireqo AI Client Assistant","desc":"Membangun asisten AI untuk pelanggan yang bisa disesuaikan per bisnis, tetap menjaga identitas, pengetahuan, sesi, dan proses handover setiap klien tetap terpisah.","date":"Sep 2026","read":"15 menit baca"},{"key":"quant","num":"04","cat":"EKSPERIMEN","title":"BIMA Quant","desc":"Eksperimen shadow trading yang sengaja dipisahkan dari proyek lain untuk menguji alur data, pemantauan, dan evaluasi tanpa mengklaim keberhasilan trading.","date":"Sep 2026","read":"12 menit baca"}],"en":[{"key":"vireqo","num":"01","cat":"PRODUCT","title":"Building Vireqo.id from Zero","desc":"From an overly broad idea into a more focused digital business. The process covered positioning, the website, Ask BIMA, SEO, and eventually a clearer GEO structure.","date":"Aug — Sep 2026","read":"18 min read"},{"key":"bima","num":"02","cat":"AI","title":"BIMA’s Evolution into BimaGinga.site","desc":"From a conversational assistant into a private AI workspace for writing, analysis, planning, research, and debugging support.","date":"Sep 2026","read":"16 min read"},{"key":"client","num":"03","cat":"ARCHITECTURE","title":"Vireqo AI Client Assistant","desc":"Building a customer-facing AI assistant that can be configured for each business while keeping client identity, knowledge, sessions, and handover flows separated.","date":"Sep 2026","read":"15 min read"},{"key":"quant","num":"04","cat":"EXPERIMENT","title":"BIMA Quant","desc":"A shadow-trading experiment deliberately separated from the other projects to test data flow, monitoring, and evaluation without claiming trading success.","date":"Sep 2026","read":"12 min read"}]},"articles":{"vireqo":{"id":["Membangun Vireqo.id dari Nol","Catatan tentang bagaimana ide yang awalnya terlalu luas dipersempit menjadi bisnis digital yang lebih jelas, lalu diuji langsung melalui website, Ask BIMA, dan proses produksi.",["Vireqo lahir dari keinginan membuat sesuatu milik saya sendiri setelah bertahun-tahun bekerja di Customer Experience. Pada awalnya, cakupannya terlalu luas: website, dashboard, pelatihan, penyediaan staf, dan konsultasi berada dalam satu payung. Semakin banyak yang saya coba masukkan, semakin sulit menjelaskan apa sebenarnya Vireqo.","Masalah utamanya bukan kekurangan layanan. Saya perlu menemukan fokus yang benar-benar dekat dengan pengalaman saya: membantu bisnis hadir lebih profesional, melayani pelanggan dengan lebih baik, dan memahami performa layanan mereka.","Saya membangun Vireqo.id sebagai website bilingual dengan penawaran yang lebih terarah: Website & Landing Page, Vireqo AI Client Assistant, paket Website + AI Client Assistant, dan Customer Service Dashboard. Ask BIMA menjadi pintu konsultasi awal sebelum percakapan diteruskan ke manusia ketika dibutuhkan.","Alurnya dibuat sederhana: pengunjung memahami layanan di Vireqo.id, memilih kebutuhan, berbicara dengan Ask BIMA untuk memperjelas konteks, lalu percakapan dapat diteruskan ke WhatsApp untuk pembahasan scope, quotation, dan implementasi.","SEO awalnya terasa seperti tahap akhir: memastikan title, description, sitemap, dan halaman utama dapat dibaca Google. Tetapi setelah Vireqo.id live, Google masih menampilkan positioning lama yang menyebut layanan yang sudah tidak menjadi fokus. Audit menunjukkan metadata statis sudah benar, sementara metadata bilingual lama masih aktif saat runtime. Setelah sumber legacy diperbaiki, fokus berikutnya bukan hanya SEO klasik, tetapi juga GEO: membuat identitas dan informasi Vireqo.id lebih mudah dipahami mesin melalui halaman About Vireqo, FAQ, llms.txt, robots.txt, sitemap, serta konsistensi entity dan product naming. Dari sini saya belajar bahwa discoverability bukan hanya soal ranking; mesin juga perlu memahami bisnis yang sedang mereka baca.","Vireqo.id sudah live dengan positioning yang lebih fokus. Ask BIMA berjalan sebagai lapisan konsultasi, homepage sudah terindeks, sitemap sudah dikirim ke Search Console, sumber FAQ dan halaman referensi tersedia untuk crawler, dan metadata lama yang menyebabkan deskripsi keliru sudah diperbaiki.","Vireqo mengajarkan saya bahwa membangun bukan hanya menambah fitur. Kadang keputusan paling penting justru menghapus hal yang tidak lagi relevan. Saya juga belajar bahwa sesuatu yang terlihat benar di layar belum tentu dibaca dengan cara yang sama oleh mesin pencari atau sistem lain."]],"en":["Building Vireqo.id from Zero","A record of how an overly broad idea became a clearer digital business, then was tested through the website, Ask BIMA, and real production work.",["Vireqo started from my desire to build something of my own after years in Customer Experience. At first, the scope was too broad: websites, dashboards, training, staffing, and consulting all sat under one umbrella. The more I tried to include, the harder it became to explain what Vireqo actually was.","The main problem was not a lack of services. I needed a focus that stayed close to my experience: helping businesses present themselves professionally, serve customers better, and understand service performance.","I built Vireqo.id as a bilingual website with a more focused offer: Website & Landing Page, Vireqo AI Client Assistant, a Website + AI Client Assistant bundle, and Customer Service Dashboard. Ask BIMA became the first consultation layer before a conversation is handed to a human when needed.","The flow is intentionally simple: visitors understand the services on Vireqo.id, choose what they need, talk with Ask BIMA to clarify context, and can then continue through WhatsApp for scope, quotation, and implementation.","SEO initially felt like a finishing step: make sure the title, description, sitemap, and homepage could be read by Google. But after Vireqo.id went live, Google was still showing legacy positioning that mentioned services no longer central to the business. The audit showed that the static metadata was correct while stale bilingual metadata was still active at runtime. After fixing that legacy source, the work expanded beyond classic SEO into GEO: making Vireqo.id easier for machines to understand through About Vireqo, FAQ, llms.txt, robots.txt, sitemap, and consistent entity and product naming. The lesson was that discoverability is not only about ranking; machines also need a clear understanding of the business they are reading.","Vireqo.id is live with a more focused position. Ask BIMA works as the consultation layer, the homepage is indexed, the sitemap has been submitted to Search Console, FAQ and reference pages are available to crawlers, and the stale metadata that caused the incorrect description has been fixed.","Vireqo taught me that building is not only about adding features. Sometimes the most important decision is removing what no longer belongs. I also learned that something can look correct on screen while being read very differently by a search engine or another system."]]},"bima":{"id":["Evolusi BIMA menjadi BimaGinga.site","Bagaimana asisten pribadi yang awalnya sederhana berkembang menjadi ruang kerja AI privat, sambil tetap dipisahkan dari produk yang digunakan pelanggan.",["BIMA awalnya hanya membantu lewat percakapan. Setelah semakin sering digunakan, saya mulai merasakan keterbatasannya: konteks mudah terputus, pekerjaan berbeda bercampur, dan chat saja tidak cukup untuk pekerjaan yang berlangsung beberapa tahap.","Saya membutuhkan ruang kerja yang bisa membantu pekerjaan sehari-hari tanpa kehilangan konteks, tetapi tetap memiliki batas yang jelas. BIMA pribadi tidak boleh bercampur dengan data atau identitas sistem yang digunakan untuk klien.","BIMA kemudian berkembang menjadi BimaGinga.site, ruang kerja privat dengan jalur untuk menulis dan memperbaiki teks, coding dan debugging, analisis data, perencanaan, riset, serta custom task. Project, library, history, dan konteks persisten menjadi bagian dari arah pengembangannya.","Setiap pekerjaan dimulai dari kebutuhan, lalu sistem mengambil konteks yang relevan, memilih model atau alat yang diperlukan, menghasilkan output, dan memvalidasi hasilnya. Riwayat dan konteks dipertahankan ketika berguna, bukan dicampurkan ke semua tugas.","Titik baliknya muncul ketika pola kerja BIMA mulai menginspirasi Vireqo AI Client Assistant dan eksperimen lain. Saat itu saya sadar bahwa kemampuan yang bisa digunakan ulang tidak berarti semua sistem harus berbagi identitas atau memori yang sama.","BimaGinga.site sekarang menjadi ruang kerja AI pribadi dan laboratorium untuk menguji pola kerja baru. Beberapa gagasannya digunakan sebagai referensi untuk proyek lain, tetapi konteks pribadi tetap berada di ruangnya sendiri.","Saya belajar bahwa memori dan konteks hanya berguna jika ada batas. Sistem yang terasa pintar bukan sistem yang mengingat semuanya, tetapi sistem yang tahu konteks mana yang relevan dan mana yang tidak boleh ikut terbawa."]],"en":["BIMA’s Evolution into BimaGinga.site","How a simple personal assistant grew into a private AI workspace while remaining separate from customer-facing products.",["BIMA began as a conversational assistant. As I used it more often, the limitations became obvious: context could break, different kinds of work could mix together, and chat alone was not enough for multi-step work.","I needed a workspace that could support daily work without constantly losing context, while still keeping clear boundaries. My personal BIMA could not become a shared source of data or identity for client-facing systems.","BIMA then evolved into BimaGinga.site, a private workspace with paths for writing and improvement, coding and debugging, data analysis, planning, research, and custom tasks. Projects, a library, history, and persistent context became part of its direction.","Each task starts with the need, then the system retrieves relevant context, uses the appropriate model or tool, produces an output, and validates the result. History and context are preserved when useful rather than being injected into every task.","The turning point came when BIMA’s working patterns began to influence the Vireqo AI Client Assistant and other experiments. That made one principle clear: reusable capability does not mean every system should share the same identity or memory.","BimaGinga.site now serves as my private AI workspace and a lab for testing new working patterns. Some ideas inform other projects, but personal context remains inside its own boundary.","I learned that memory and context are only useful when they have boundaries. A system does not become smarter by remembering everything; it becomes more useful by knowing what context belongs and what must stay out."]]},"client":{"id":["Vireqo AI Client Assistant","Dari satu asisten untuk satu bisnis menuju pola yang bisa digunakan beberapa klien tanpa mencampur identitas, pengetahuan, sesi, atau proses handover.",["Vireqo AI Client Assistant awalnya berangkat dari kebutuhan sederhana: website bisnis seharusnya tidak hanya menampilkan informasi, tetapi juga bisa menyambut dan membantu calon pelanggan ketika tim manusia belum tersedia.","Ketika konsep ini mulai diuji untuk konteks bisnis yang berbeda, tantangannya berubah. Masalahnya bukan lagi sekadar membuat chatbot yang bisa menjawab, tetapi memastikan setiap bisnis memiliki identitas, tone, pengetahuan, sesi, dan aturan handover sendiri.","Saya mengembangkan pola multi-client dengan konfigurasi dan pengetahuan yang dipisahkan per klien. NUSA di JelNusa digunakan sebagai proof of concept untuk memastikan satu layanan bersama dapat menghasilkan pengalaman yang berbeda tanpa mencampur identitas. RAV Dashboard membantu menata proses onboarding dan materi pengetahuan klien.","Alurnya: data bisnis dan materi pengetahuan dikumpulkan saat onboarding, konfigurasi klien dibentuk, pengunjung memulai sesi dengan identitas bisnis tersebut, assistant menggunakan konteks yang sesuai, lalu handover dilakukan ke kanal manusia ketika dibutuhkan.","Titik baliknya terjadi ketika NUSA sempat membawa konteks Vireqo/BIMA. Itu menunjukkan bahwa mengganti nama dan avatar saja bukan multi-tenancy. Pemisahan harus terjadi pada konfigurasi, knowledge, session, dan data di bawah tampilan.","Saat ini pola tersebut sudah diuji melalui Ask BIMA di Vireqo.id dan NUSA di JelNusa. Keduanya memiliki identitas berbeda, sementara pendekatan shared deployment digunakan untuk menghindari kebutuhan membuat instance terpisah untuk setiap klien.","Saya belajar bahwa assistant yang terlihat sederhana di depan membutuhkan disiplin arsitektur di belakang. Semakin banyak klien yang ingin dilayani, semakin penting memastikan konteks yang benar masuk ke percakapan yang benar."]],"en":["Vireqo AI Client Assistant","From one assistant for one business toward a pattern that can serve multiple clients without mixing identity, knowledge, sessions, or handover flows.",["The Vireqo AI Client Assistant began with a simple idea: a business website should do more than display information. It should also be able to welcome and help potential customers when the human team is not immediately available.","Once the concept was tested in different business contexts, the challenge changed. It was no longer just about building a chatbot that could answer questions; each business needed its own identity, tone, knowledge, sessions, and handover rules.","I developed a multi-client pattern with configuration and knowledge separated by client. NUSA on JelNusa became the proof of concept for showing that one shared service could create different client experiences without mixing identities. The RAV Dashboard helped structure onboarding and client knowledge materials.","The flow is: business information and knowledge are collected during onboarding, a client configuration is created, a visitor starts a session under that business identity, the assistant uses the appropriate context, and the conversation is handed to a human channel when needed.","The turning point came when NUSA briefly carried Vireqo/BIMA context. That exposed an important flaw: changing a name and avatar is not multi-tenancy. Separation has to exist in configuration, knowledge, sessions, and data beneath the interface.","The pattern has now been tested through Ask BIMA on Vireqo.id and NUSA on JelNusa. They keep separate identities while using a shared-deployment approach so a new client does not require a completely separate service instance.","I learned that a simple-looking assistant on the front end requires architectural discipline behind it. The more clients a system serves, the more important it becomes to make sure the right context reaches the right conversation."]]},"quant":{"id":["BIMA Quant","Eksperimen shadow trading untuk menguji bagaimana data, pemantauan, evaluasi, dan batas risiko bisa disusun dalam satu panel tanpa mencampurnya dengan proyek utama.",["BIMA Quant muncul sebagai eksperimen terpisah. Tujuannya bukan memperluas Vireqo atau BimaGinga, melainkan memberi ruang untuk menguji ide trading berbasis data tanpa membawa risiko eksperimen itu ke sistem lain.","Fokus saya adalah membuat proses yang bisa diamati dan diaudit sebelum membicarakan live trading: data harus bergerak, trade harus tercatat, hasil harus bisa dilihat, dan kegagalan harus terlihat jelas.","Panel BIMA Quant mencakup shadow trading, live scanner, active trades, recent trades, recent activity, equity curve, serta indikator seperti win rate, realized PnL, profit factor, drawdown, dan validation status. Semua eksekusi tetap bersifat simulasi.","Scanner mengamati kandidat, strategi menentukan apakah sinyal memenuhi aturan, posisi simulasi dibuka dan dipantau, hasil dicatat ke journal, lalu metrik diperbarui untuk evaluasi berikutnya.","Titik baliknya justru datang dari error dan kondisi macet. Ketika live movement berhenti atau proses shadow trading tidak berjalan, tampilan yang terlihat bagus menjadi tidak berarti. Fokus kemudian bergeser ke stabilitas, audit trade, dan validasi sebelum menambah kompleksitas.","BIMA Quant saat ini masih merupakan eksperimen shadow trading. Panel sudah menampilkan aktivitas, trade, kurva performa, scanner, dan status engine, tetapi hasilnya belum memenuhi alasan untuk mengklaim kesiapan live trading atau keberhasilan strategi.","Saya belajar untuk tidak menyamakan dashboard yang terlihat aktif dengan sistem yang benar-benar sehat. Untuk eksperimen seperti ini, bukti, log, konsistensi proses, dan kemampuan menemukan kegagalan jauh lebih penting daripada tampilan profit sesaat."]],"en":["BIMA Quant","A shadow-trading experiment for testing how data, monitoring, evaluation, and risk boundaries can live in one panel without being mixed into the main projects.",["BIMA Quant began as a separate experiment. Its purpose was not to expand Vireqo or BimaGinga, but to create a safe place to test data-driven trading ideas without carrying that experimental risk into other systems.","My focus was to build a process that could be observed and audited before even discussing live trading: data had to move, trades had to be recorded, results had to be visible, and failures had to be obvious.","The BIMA Quant panel includes shadow trading, a live scanner, active trades, recent trades, recent activity, an equity curve, and metrics such as win rate, realized PnL, profit factor, drawdown, and validation status. Execution remains simulated.","The scanner observes candidates, the strategy checks whether a signal meets its rules, a simulated position is opened and monitored, the outcome is written to the journal, and the metrics are updated for the next evaluation cycle.","The turning point came from errors and stalls. When live movement stopped or shadow trading failed to progress, a polished interface meant very little. The focus shifted toward stability, trade auditing, and validation before adding more complexity.","BIMA Quant is still a shadow-trading experiment. The panel now shows activity, trades, a performance curve, scanner data, and engine status, but the evidence does not support claiming live-trading readiness or strategy success.","I learned not to confuse an active-looking dashboard with a healthy system. In an experiment like this, evidence, logs, process consistency, and the ability to surface failure matter far more than a momentary profit display."]]}}};

const timeline={"id":[["10+ tahun","Customer Experience sebagai fondasi","Bekerja dekat dengan pelanggan dan operasional membentuk cara berpikir saya: pahami friksi lebih dulu, baru tentukan sistem yang benar-benar perlu dibangun."],["Agustus 2026","Mulai membangun milik sendiri","Vireqo dimulai dengan cakupan yang terlalu luas. Proses membangun memaksa saya memilih fokus dan menjelaskan nilai produknya dengan lebih sederhana."],["12 September","Vireqo.id mulai live","Ide berubah menjadi sesuatu yang bisa dilihat dan digunakan orang lain: ada domain, website, layanan, dan alur konsultasi yang nyata."],["17 September","Percakapan nyata pertama","Ask BIMA menangani percakapan pelanggan pertamanya. Jumlahnya baru satu, tetapi untuk pertama kalinya sistem digunakan di luar pengujian saya sendiri."],["Akhir September","Produksi menjadi bagian dari proses belajar","Masalah mobile, deployment, isolasi multi-client, dan metadata Google menunjukkan bahwa selesai dibuat belum tentu berarti selesai diuji."]],"en":[["10+ years","Customer Experience as the foundation","Working close to customers and operations shaped how I think: understand the friction first, then decide what system actually needs to be built."],["August 2026","Starting to build something of my own","Vireqo began with a scope that was too broad. Building it forced me to choose a focus and explain the product value more simply."],["12 September","Vireqo.id goes live","The idea became something other people could see and use: a domain, website, services, and a real consultation flow."],["17 September","The first real customer conversation","Ask BIMA handled its first customer conversation. The number was only one, but it was the first time the system was used outside my own testing."],["Late September","Production becomes part of the learning process","Mobile issues, deployment, multi-client isolation, and Google metadata showed me that finished building does not mean finished testing."]]};
function render(){

 $(".persp").textContent=u.persp;$(".perspective .quote").textContent=u.quote;$(".perspective .desc").textContent=u.quoteSub;$(".topicsLabel").textContent=u.topics;$(".chips").innerHTML=u.topicList.map(x=>`<span class="chip">${x}</span>`).join("");
 $(".journey h2").textContent=lang==="id"?"Perjalanan sejauh ini":"The journey so far";$(".timeline").innerHTML=timeline[lang].map(x=>`<div class="trow"><div class="when">${x[0]}</div><div><h3>${x[1]}</h3><p>${x[2]}</p></div></div>`).join("");
 $(".about h2").textContent=lang==="id"?"Tentang":"About";$(".about p").textContent=lang==="id"?"Ini bukan portfolio coding. Ini adalah latar belakang perjalanan saya dari Customer Experience menuju cara baru memecahkan masalah, mengarahkan produk, bereksperimen dengan AI, menguji sistem, dan belajar dari apa yang tidak bekerja.":"This is not a coding portfolio. It is the background to my journey from Customer Experience toward a new way of solving problems, directing products, experimenting with AI, testing systems, and learning from what does not work.";
 $$(".toggle button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
 if(current)renderArticle(current);
}

 const previousVisual=$(".articleTop .articleVisual");
 if(previousVisual) previousVisual.remove();
 const projectVisual=document.createElement("div");
 projectVisual.className="articleVisual";
 projectVisual.innerHTML=`<img src="${IMAGES[k]}" alt="${a[0]}">`;

$(".toc").innerHTML=`<div>${lang==="id"?"DALAM TULISAN INI":"IN THIS STORY"}</div>`+sections.map((x,i)=>`<a href="#ch${i}">${String(i+1).padStart(2,"0")} ${x}</a>`).join("");

function goHome(){current=null;$(".home").classList.remove("hide");$(".article").classList.remove("on");history.replaceState(null,"","#home");scrollTo(0,0)}

["home","work","journey","about"].forEach(id=>{const el=document.getElementById(id);if(el)spy.observe(el)});
